<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모임 날짜 정하기</title>
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f3f5fb,#12151d);--card:light-dark(#fff,#1b202b);--ink:light-dark(#1d2330,#e9ecf3);
  --mute:light-dark(#6b7385,#9aa3b5);--line:light-dark(#e3e7f0,#2b3242);
  --pri:light-dark(#3a5cf5,#7b93ff);--ok:#1fa36b;--no:#e5484d;--maybe:#f2a516}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
#app{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,42px)}h2{font-size:22px;margin-bottom:10px}h3{font-size:18px;margin:4px 0 8px}
.sub{color:var(--mute);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.form label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{font:inherit;font-size:16px;border:0;border-radius:12px;background:var(--pri);color:#fff;padding:12px 18px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.err{color:var(--no);font-size:14px;min-height:1em;margin:0 0 8px}
.banner{background:color-mix(in srgb,var(--maybe) 18%,var(--card));border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.share{display:flex;gap:8px;margin-top:12px}.share input{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-top:16px;position:sticky;top:8px;z-index:2}
.tabs button{font:inherit;border:0;border-radius:10px;padding:10px;min-height:44px;background:none;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
.me{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:14px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--mute);margin:10px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.month{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;font-size:13px;color:var(--mute);padding:2px 0}
.w0{color:var(--no)}.w6{color:var(--pri)}
.day{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:transform .12s}
.day:active{transform:scale(.94)}
.day.off{background:none;border-color:transparent;opacity:.3;cursor:default}
.day span{font-size:16px;line-height:1}
.day i{font-style:normal;font-size:11px;line-height:1;margin-top:4px;min-height:11px}
.day.w0 span{color:var(--no)}.day.w6 span{color:var(--pri)}
.m1{background:var(--no);border-color:var(--no)}.m1 span,.m1 i{color:#fff!important}
.m2{background:color-mix(in srgb,var(--maybe) 35%,var(--card));border-color:var(--maybe)}
.r.good{background:color-mix(in srgb,var(--ok) 24%,var(--card));border-color:color-mix(in srgb,var(--ok) 50%,var(--card))}
.r.bad{background:color-mix(in srgb,var(--no) var(--h),var(--card));border-color:transparent}
.r.dark span,.r.dark i{color:#fff!important}
.r.sel{outline:3px solid var(--ink);outline-offset:1px}
.dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--maybe)}
.top3{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.top3 li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg);cursor:pointer}
.top3 .rk{font-weight:700;font-size:18px;color:var(--pri);width:34px}
.top3 strong{font-size:18px;display:block}.top3 small{color:var(--mute)}
.detail p{margin:6px 0}.detail b{display:inline-block;width:46px}
.msg{text-align:center;color:var(--mute);padding:60px 0}
a{color:var(--pri)}
@media(max-width:600px){.day span{font-size:14px}.day i{font-size:10px}.grid{gap:3px}.day{border-radius:9px}}
@media(prefers-reduced-motion:reduce){.day{transition:none}}
</style>
</head>
<body>
<div id="app"><p class="msg">불러오는 중…</p></div>
<script>
window.showErr=function(t){var a=document.getElementById('app');if(a)a.innerHTML='<p class="msg">문제가 생겼어<br><small>'+String(t).replace(/[&<>]/g,'')+'</small></p>';};
addEventListener('error',function(e){showErr(e.message||'스크립트 오류');});
addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason);});
setTimeout(function(){var a=document.getElementById('app');if(a&&a.textContent.trim()==='불러오는 중…')showErr('15초 넘게 응답이 없어. 인터넷 연결이나 databaseURL을 확인해줘.');},15000);
</script>
<script type="module">
// ============================================================
// ① Firebase 콘솔에서 복사한 설정을 여기에 붙여넣기
//    (비워두면 '미리보기 모드' – 내 기기에만 저장됨)
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: ""
};
// ============================================================
{
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD = ['일','월','화','수','목','금','토'];
const label = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const nameKey = n => encodeURIComponent(n.trim()).replace(/\./g, '%2E');
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
             set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

async function makeStore(){
  if (firebaseConfig.databaseURL) {
    const { initializeApp } = await import(FB + 'firebase-app.js');
    const { getDatabase, ref, set, push, onValue } = await import(FB + 'firebase-database.js');
    const db = getDatabase(initializeApp(firebaseConfig));
    return {
      demo: false,
      async create(meta){ const id = push(ref(db, 'events')).key; await set(ref(db, `events/${id}/meta`), meta); return id; },
      watch(id, cb){ onValue(ref(db, `events/${id}`), s => cb(s.val()), e => showErr('DB 읽기 실패: ' + e.message + ' (3단계 규칙 확인)')); },
      save(id, k, v){ return set(ref(db, `events/${id}/votes/${k}`), v); }
    };
  }
  const load = () => { try { return JSON.parse(ls.get('demo-events') || '{}'); } catch { return {}; } };
  const listeners = [];
  return {
    demo: true,
    async create(meta){ const o = load(), id = 'demo' + Date.now().toString(36); o[id] = { meta }; ls.set('demo-events', JSON.stringify(o)); return id; },
    watch(id, cb){ const f = () => cb(load()[id] || null); listeners.push(f); f(); addEventListener('storage', f); },
    async save(id, k, v){ const o = load(); o[id] ??= {}; o[id].votes ??= {}; o[id].votes[k] = v; ls.set('demo-events', JSON.stringify(o)); listeners.forEach(f => f()); }
  };
}

let store;
const S = { id: new URLSearchParams(location.search).get('e'), ev: null, loaded: false, me: null, mine: {}, init: false, tab: 'check', pick: null, saved: '' };
if (S.id) S.me = ls.get('me:' + S.id);

function render(){
  if (app.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') { S.dirty = true; return; }
  S.dirty = false;
  if (!S.id) { if (!$('#cf')) renderCreate(); return; }
  if (!S.loaded) { app.innerHTML = '<p class="msg">불러오는 중…</p>'; return; }
  if (!S.ev || !S.ev.meta) { app.innerHTML = `<p class="msg">모임을 찾을 수 없어.<br><a href="${location.pathname}">새 모임 만들기</a></p>`; return; }
  renderEvent();
}
const demoBanner = () => store.demo ? '<div class="banner">지금은 <b>미리보기 모드</b>라 이 기기에만 저장돼. 코드에 Firebase 설정을 넣으면 친구들이랑 공유돼.</div>' : '';

function renderCreate(){
  const t = new Date(), e = new Date(); e.setDate(e.getDate() + 30);
  app.innerHTML = `${demoBanner()}
  <h1>모임 날짜 정하기</h1>
  <p class="sub">기간만 정하면 링크가 나와. 친구들은 안 되는 날만 콕콕 누르면 끝.</p>
  <form id="cf" class="card form">
    <label>모임 이름<input id="ct" required maxlength="40" placeholder="예: 연말 송년회"></label>
    <div class="row2">
      <label>시작일<input type="date" id="cs" required value="${key(t)}"></label>
      <label>종료일<input type="date" id="ce" required value="${key(e)}"></label>
    </div>
    <p class="err" id="cerr"></p>
    <button class="btn">모임 만들기</button>
  </form>`;
  $('#cs').onchange = () => { if ($('#ce').value < $('#cs').value) $('#ce').value = $('#cs').value; $('#ce').min = $('#cs').value; };
  $('#cf').onsubmit = async ev => {
    ev.preventDefault();
    const s = $('#cs').value, en = $('#ce').value, err = $('#cerr');
    if (s > en) { err.textContent = '종료일이 시작일보다 빨라.'; return; }
    if ((parse(en) - parse(s)) / 864e5 > 120) { err.textContent = '기간은 120일 이내로 정해줘.'; return; }
    err.textContent = '만드는 중…';
    try {
      const id = await store.create({ title: $('#ct').value.trim(), start: s, end: en, created: Date.now() });
      location.href = location.pathname + '?e=' + id;
    } catch (x) { err.textContent = '만들기 실패: ' + (x && x.message || '') + ' – 규칙을 확인해줘.'; }
  };
}

const days = () => { const out = [], d = parse(S.ev.meta.start), e = parse(S.ev.meta.end); while (d <= e) { out.push(key(d)); d.setDate(d.getDate() + 1); } return out; };
function people(){
  const v = { ...(S.ev.votes || {}) };
  if (S.me) v[nameKey(S.me)] = { name: S.me, marks: S.mine };
  return Object.values(v).map(p => ({ name: p.name, marks: p.marks || {} })).sort((a,b) => a.name.localeCompare(b.name, 'ko'));
}
function stats(ds, ps){
  const m = {};
  for (const k of ds) { const no = [], mb = []; for (const p of ps) { if (p.marks[k] == 1) no.push(p.name); else if (p.marks[k] == 2) mb.push(p.name); } m[k] = { no, mb }; }
  return m;
}
function cal(ds, cell){
  const set = new Set(ds), first = parse(ds[0]), last = parse(ds[ds.length-1]);
  const m = new Date(first.getFullYear(), first.getMonth(), 1);
  let html = '';
  while (m <= last) {
    const y = m.getFullYear(), mo = m.getMonth(), n = new Date(y, mo+1, 0).getDate();
    let c = WD.map((w,i) => `<div class="wd w${i}">${w}</div>`).join('') + '<div></div>'.repeat(new Date(y, mo, 1).getDay());
    for (let d = 1; d <= n; d++) {
      const k = `${y}-${pad(mo+1)}-${pad(d)}`, dow = new Date(y, mo, d).getDay();
      c += set.has(k) ? cell(k, d, dow) : `<div class="day off w${dow}"><span>${d}</span></div>`;
    }
    html += `<section class="month"><h3>${y}년 ${mo+1}월</h3><div class="grid">${c}</div></section>`;
    m.setMonth(mo + 1);
  }
  return html;
}

function renderEvent(){
  const M = S.ev.meta, ds = days(), ps = people(), st = stats(ds, ps), link = location.href.split('#')[0];
  document.title = M.title + ' · 날짜 정하기';
  let body;
  if (S.tab === 'check') {
    body = !S.me ? `
      <form id="nf" class="card form">
        <h2>먼저 이름을 알려줘</h2>
        <label>내 이름<input id="nn" required maxlength="20" placeholder="예: 민수"></label>
        <button class="btn">체크 시작</button>
      </form>` : `
      <div class="card">
        <div class="me"><div><b>${esc(S.me)}</b>(으)로 체크 중 <span class="status" id="st">${esc(S.saved)}</span></div>
          <button class="btn ghost" data-act="rename">이름 바꾸기</button></div>
        <div class="legend"><span><i style="background:var(--no)"></i>1번 탭: 안됨</span><span><i style="background:var(--maybe)"></i>2번 탭: 애매</span><span>3번 탭: 취소</span></div>
        <p class="sub" style="font-size:14px">다 되면 아무것도 안 눌러도 돼. 자동 저장돼.</p>
        ${cal(ds, (k, d, dow) => { const v = S.mine[k] || 0; return `<button class="day m${v} w${dow}" data-k="${k}" aria-label="${label(k)}"><span>${d}</span><i>${['','안됨','애매'][v]}</i></button>`; })}
      </div>`;
  } else {
    const n = ps.length;
    const rank = ds.map(k => ({ k, ...st[k] })).sort((a,b) => a.no.length - b.no.length || a.mb.length - b.mb.length || (a.k < b.k ? -1 : 1)).slice(0, 3);
    const desc = r => r.no.length + r.mb.length === 0 ? `${n}명 전원 가능` : [r.no.length && `안됨 ${r.no.length}명`, r.mb.length && `애매 ${r.mb.length}명`].filter(Boolean).join(' · ');
    const p = S.pick && st[S.pick];
    const ok = p ? ps.map(x => x.name).filter(x => !p.no.includes(x) && !p.mb.includes(x)) : [];
    const names = a => a.length ? a.map(esc).join(', ') : '-';
    body = !n ? '<div class="card"><p class="msg" style="padding:30px 0">아직 아무도 체크 안 했어.<br>링크를 친구들한테 보내봐!</p></div>' : `
      <div class="card"><h2>추천 날짜</h2><ol class="top3">${rank.map((r,i) => `<li data-k="${r.k}"><span class="rk">${i+1}위</span><div><strong>${label(r.k)}</strong><small>${desc(r)}</small></div></li>`).join('')}</ol></div>
      ${p ? `<div class="card detail"><h2>${label(S.pick)}</h2><p><b style="color:var(--ok)">가능</b>${names(ok)}</p><p><b style="color:var(--maybe)">애매</b>${names(p.mb)}</p><p><b style="color:var(--no)">안됨</b>${names(p.no)}</p></div>` : ''}
      <div class="card">
        <h2>한눈에 보기</h2>
        <div class="legend"><span><i style="background:var(--ok)"></i>전원 가능</span><span><i style="background:var(--no)"></i>진할수록 안 되는 사람 많음</span><span><i style="background:var(--maybe);border-radius:50%"></i>애매 있음</span></div>
        <p class="sub" style="font-size:14px">날짜를 누르면 누가 안 되는지 보여줘.</p>
        ${cal(ds, (k, d, dow) => { const s = st[k], r = s.no.length / n, h = Math.round(18 + r * 72);
          return `<button class="day r ${s.no.length ? 'bad' : 'good'} ${r > .45 ? 'dark' : ''} ${S.pick === k ? 'sel' : ''} w${dow}" data-k="${k}" style="--h:${h}%" aria-label="${label(k)}"><span>${d}</span><i>${s.no.length ? s.no.length + '명' : ''}</i>${s.mb.length ? '<b class="dot"></b>' : ''}</button>`; })}
      </div>`;
  }
  app.innerHTML = `${demoBanner()}
    <h1>${esc(M.title)}</h1>
    <p class="sub">${label(M.start)} ~ ${label(M.end)} · ${ps.length}명 참여</p>
    ${ps.length ? `<div class="chips">${ps.map(p => `<span class="chip">${esc(p.name)}</span>`).join('')}</div>` : ''}
    <div class="share"><input id="lk" readonly value="${esc(link)}"><button class="btn" data-act="copy">링크 복사</button></div>
    <nav class="tabs"><button data-tab="check" class="${S.tab === 'check' ? 'on' : ''}">내 일정 체크</button><button data-tab="result" class="${S.tab === 'result' ? 'on' : ''}">종합 결과</button></nav>
    ${body}`;
  const nf = $('#nf');
  if (nf) nf.onsubmit = e => {
    e.preventDefault();
    const nm = $('#nn').value.trim(); if (!nm) return;
    S.me = nm; ls.set('me:' + S.id, nm);
    S.mine = { ...(S.ev.votes?.[nameKey(nm)]?.marks || {}) }; S.init = true;
    document.activeElement.blur(); queueSave(0); render();
  };
}

let tm;
function paintStatus(){ const el = $('#st'); if (el) el.textContent = S.saved; }
function queueSave(delay = 500){
  S.saved = '저장 중…'; paintStatus(); clearTimeout(tm);
  tm = setTimeout(async () => {
    try { await store.save(S.id, nameKey(S.me), { name: S.me, marks: S.mine, at: Date.now() }); S.saved = '저장됨 ✓'; }
    catch { S.saved = '저장 실패 – 인터넷을 확인해줘'; }
    paintStatus();
  }, delay);
}

app.addEventListener('click', async e => {
  const t = e.target.closest('[data-k],[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.act === 'copy') {
    try { await navigator.clipboard.writeText($('#lk').value); t.textContent = '복사됨!'; }
    catch { $('#lk').select(); t.textContent = '길게 눌러 복사'; }
    setTimeout(() => t.textContent = '링크 복사', 1500); return;
  }
  if (t.dataset.act === 'rename') { S.me = null; S.mine = {}; S.init = false; S.saved = ''; ls.set('me:' + S.id, null); render(); return; }
  const k = t.dataset.k;
  if (S.tab === 'check' && S.me) { const v = ((S.mine[k] || 0) + 1) % 3; if (v) S.mine[k] = v; else delete S.mine[k]; queueSave(); render(); }
  else if (S.tab === 'result') { S.pick = S.pick === k ? null : k; render(); if (S.pick) $('.detail')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
});
app.addEventListener('focusout', () => setTimeout(() => { if (S.dirty && !app.contains(document.activeElement)) render(); }, 0));

(async () => {
  try { store = await makeStore(); }
  catch (x) { showErr('Firebase 연결 실패: ' + (x && x.message || x)); return; }
  render();
  if (!S.id) return;
  store.watch(S.id, data => {
    S.ev = data; S.loaded = true;
    if (S.me && !S.init && data) { S.mine = { ...(data.votes?.[nameKey(S.me)]?.marks || {}) }; S.init = true; }
    render();
  });
})();
}
</script>
</body>
</html>
